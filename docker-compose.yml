services:
  store-engine:
    build:
      context: .
      dockerfile: store-engine/Dockerfile
    ports:
      - "6380:6380"
      - "8090:8090"
    env_file:
      - .env
    environment:
      - MINISTORE_HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - store-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_WS_URL=ws://localhost:8090
    depends_on:
      - store-engine
    restart: unless-stopped

volumes:
  store-data:
